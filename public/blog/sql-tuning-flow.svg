<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17" />
      <stop offset="1" stop-color="#070B12" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#DCE7FF" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#60A5FA" fill-opacity="0.75" />
    </marker>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)" />
  <rect width="1200" height="700" fill="url(#grid)" />
  <text x="48" y="64" font-family="Consolas, monospace" font-size="13" letter-spacing="3" fill="#60A5FA">QUERY TUNING LOOP</text>
  <text x="48" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">Measure. Inspect. Change one thing. Verify.</text>
  <text x="48" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94A3B8">A production-safe routine that avoids speculative rewrites.</text>
  
      <rect x="80" y="210" width="240" height="128" rx="18" fill="#0E1523" stroke="#60A5FA" stroke-opacity="0.35" />
      <text x="100" y="244" font-family="Consolas, monospace" font-size="12" letter-spacing="2" fill="#60A5FA">01</text>
      <text x="100" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#E5EDF8">Measure</text>
      <text x="100" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#94A3B8">Capture duration, reads, waits, and frequency</text>
    
      <rect x="340" y="210" width="240" height="128" rx="18" fill="#0E1523" stroke="#60A5FA" stroke-opacity="0.35" />
      <text x="360" y="244" font-family="Consolas, monospace" font-size="12" letter-spacing="2" fill="#60A5FA">02</text>
      <text x="360" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#E5EDF8">Inspect</text>
      <text x="360" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#94A3B8">Read the actual plan and row estimates</text>
    
      <rect x="600" y="210" width="240" height="128" rx="18" fill="#0E1523" stroke="#60A5FA" stroke-opacity="0.35" />
      <text x="620" y="244" font-family="Consolas, monospace" font-size="12" letter-spacing="2" fill="#60A5FA">03</text>
      <text x="620" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#E5EDF8">Change</text>
      <text x="620" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#94A3B8">Rewrite, index, or adjust data access</text>
    
      <rect x="860" y="210" width="240" height="128" rx="18" fill="#0E1523" stroke="#60A5FA" stroke-opacity="0.35" />
      <text x="880" y="244" font-family="Consolas, monospace" font-size="12" letter-spacing="2" fill="#60A5FA">04</text>
      <text x="880" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#E5EDF8">Verify</text>
      <text x="880" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#94A3B8">Re-measure under the same conditions</text>
    
  <path d="M320 274H334" stroke="#60A5FA" stroke-opacity="0.6" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M580 274H594" stroke="#60A5FA" stroke-opacity="0.6" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M840 274H854" stroke="#60A5FA" stroke-opacity="0.6" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M980 338V450H200V338" fill="none" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrow)" />
  <text x="500" y="488" font-family="Consolas, monospace" font-size="13" fill="#64748B">repeat until the measured bottleneck moves</text>
  <rect x="80" y="540" width="1040" height="92" rx="18" fill="#0E1523" stroke="#60A5FA" stroke-opacity="0.22" />
  <text x="108" y="574" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#E5EDF8">Keep the evidence</text>
  <text x="108" y="602" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#94A3B8">Record the query, plan, dataset size, and measured before/after result so the change remains reviewable.</text>
</svg>