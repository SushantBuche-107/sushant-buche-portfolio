<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio platform architecture</title>
  <desc id="desc">A static React single-page application reads typed content from one JSON source through selectors. Routes render pages and components, the 3D hero loads lazily, and build scripts generate SEO files and image assets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#0E1420"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.1" cy="0" r="0.7">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="1" cy="1" r="0.65">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#94A3B8" stroke-opacity="0.055"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67E8F9"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <rect width="1200" height="700" fill="url(#glowA)"/>
  <rect width="1200" height="700" fill="url(#glowB)"/>

  <text x="70" y="76" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">Portfolio platform architecture</text>
  <text x="70" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#7E889B">Static React single-page application · one typed content source · progressive 3D enhancement</text>

  <rect x="70" y="150" width="250" height="118" rx="18" fill="#151D2B" stroke="#6366F1" stroke-opacity="0.55" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="96" cy="177" r="5" fill="#67E8F9"/>
  <text x="110" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6" fill="#67E8F9">CONTENT SOURCE</text>
  <text x="94" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#F8FAFC">portfolioData.json</text>
  <text x="94" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#A7B0C0">Profile, skills, projects, articles,</text>
  <text x="94" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#A7B0C0">contact config, navigation, resume.</text>

  <rect x="390" y="150" width="270" height="118" rx="18" fill="#151D2B" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="416" cy="177" r="5" fill="#A5B4FC"/>
  <text x="430" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6" fill="#A5B4FC">TYPED BOUNDARY</text>
  <text x="414" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#F8FAFC">Repository and selectors</text>
  <text x="414" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#A7B0C0">Safe URL checks, publication filters,</text>
  <text x="414" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#A7B0C0">and domain types shared by pages.</text>

  <rect x="730" y="150" width="270" height="118" rx="18" fill="#151D2B" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="756" cy="177" r="5" fill="#A5B4FC"/>
  <text x="770" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6" fill="#A5B4FC">PRESENTATION</text>
  <text x="754" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#F8FAFC">Routes and components</text>
  <text x="754" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#A7B0C0">React Router pages, shared UI,</text>
  <text x="754" y="262" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#A7B0C0">project filters, resume, blog.</text>

  <rect x="730" y="382" width="270" height="118" rx="18" fill="#151D2B" stroke="#06B6D4" stroke-opacity="0.42" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="756" cy="409" r="5" fill="#67E8F9"/>
  <text x="770" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6" fill="#67E8F9">LAZY ENHANCEMENT</text>
  <text x="754" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#F8FAFC">React Three Fiber hero</text>
  <text x="754" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#A7B0C0">Separate chunk after idle time,</text>
  <text x="754" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#A7B0C0">with static and reduced-motion fallbacks.</text>

  <rect x="390" y="382" width="270" height="118" rx="18" fill="#151D2B" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="416" cy="409" r="5" fill="#A5B4FC"/>
  <text x="430" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6" fill="#A5B4FC">DISCOVERABILITY</text>
  <text x="414" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#F8FAFC">SEO layer</text>
  <text x="414" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#A7B0C0">Title, description, canonical, Open Graph,</text>
  <text x="414" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#A7B0C0">and JSON-LD generated from content.</text>

  <rect x="70" y="382" width="250" height="118" rx="18" fill="#151D2B" stroke="#94A3B8" stroke-opacity="0.24" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="96" cy="409" r="5" fill="#A5B4FC"/>
  <text x="110" y="414" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6" fill="#A5B4FC">BUILD TIME</text>
  <text x="94" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#F8FAFC">Release scripts</text>
  <text x="94" y="476" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#A7B0C0">Robots and sitemap generation,</text>
  <text x="94" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#A7B0C0">Open Graph and icon rasterisation.</text>

  <line x1="320" y1="209" x2="382" y2="209" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="209" x2="722" y2="209" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M865 268L865 374" stroke="#67E8F9" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrowAccent)"/>
  <text x="880" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#67E8F9">dynamic import</text>

  <path d="M525 268L525 374" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M320 441L382 441" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M660 441L722 441" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 4"/>

  <rect x="70" y="574" width="930" height="62" rx="14" fill="#0D1320" stroke="#94A3B8" stroke-opacity="0.16"/>
  <text x="94" y="600" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#7E889B">First release boundary</text>
  <text x="94" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#A7B0C0">Static hosting only: no application backend, database, CMS, or third-party content service. A future repository adapter can replace JSON without rewriting pages.</text>

  <rect x="1030" y="574" width="100" height="62" rx="14" fill="#111827" stroke="#34D399" stroke-opacity="0.35"/>
  <circle cx="1056" cy="605" r="5" fill="#34D399"/>
  <text x="1070" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#A7B0C0">static SPA</text>
</svg>
