<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0B0F17" />
        <stop offset="1" stop-color="#070B12" />
      </linearGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M40 0H0V40" fill="none" stroke="#DCE7FF" stroke-opacity="0.04" stroke-width="1" />
      </pattern>
      <marker id="diagram-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0L10 5L0 10z" fill="#22D3EE" fill-opacity="0.7" />
      </marker>
    </defs>
    <rect width="1200" height="700" fill="url(#bg)" />
    <rect width="1200" height="700" fill="url(#grid)" />
    <text x="48" y="64" font-family="Consolas, monospace" font-size="13" letter-spacing="3" fill="#22D3EE">ARCHITECTURE OVERVIEW</text>
    <text x="48" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#F8FAFC">AgentFlow execution path</text>
    <text x="48" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94A3B8">YAML defines the control flow; agents own domain work; Kafka records node results.</text>
    
      <g>
