        <text x="602" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#E5EDF8">Compiler</text>
        <text x="602" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#94A3B8">Reads YAML + node paths</text>
      </g>
      <g>
